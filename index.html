<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التكاثر اللاجنسي | عرض تفاعلي STEAM</title>

<!-- الخط العربي (إذا لم يتوفر إنترنت يُستخدم خط النظام تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<!-- مكتبة الرسم p5.js : تُحمَّل أولًا من الملف المحلي p5.min.js (يعمل بدون إنترنت)
     وإذا لم يوجد الملف بجانب index.html تُحمَّل من الإنترنت تلقائيًا -->
<script src="p5.min.js"></script>
<script>window.p5 || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"><\/script>');</script>

<style>
/* =====================================================================
   1) الألوان والخطوط العامة
   ===================================================================== */
:root{
  --p900:#2e1065; --p800:#3b1a7a; --p700:#5b21b6; --p600:#6d3fd1; --p500:#8b5cf6;
  --p400:#a78bfa; --p300:#c4b5fd; --p200:#ddd6fe; --p100:#ede9fe; --p50:#f8f5ff;
  --ink:#2a1b4a; --muted:#6b5f86;
  --coral:#ff7a59; --sea:#12b5a6; --sun:#ffc84a;
  --ok:#16a34a; --okbg:#dcfce7; --bad:#db2777;
  --shadow:0 18px 50px -20px rgba(76,29,149,.38);
  --font:'Tajawal','Cairo','Geeza Pro','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1b0b3a;font-family:var(--font);color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus{outline:none}
input,textarea{font-family:inherit}
.ico-svg{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block}

/* =====================================================================
   2) مسرح العرض: مقاس ثابت يتم تكبيره ليملأ الشاشة كاملة دون تمرير
   ===================================================================== */
#stage{position:absolute;left:50%;top:50%;transform-origin:center center;overflow:hidden;background:var(--p50)}
#slides{position:absolute;inset:0;overflow:hidden}

.slide{
  position:absolute;inset:0;display:flex;flex-direction:column;padding:58px 96px 138px;
  opacity:0;visibility:hidden;
  transition:opacity .55s ease, transform .75s cubic-bezier(.2,.8,.2,1), visibility 0s linear .75s;
  background:
    radial-gradient(900px 620px at 104% -12%, #e6dbff 0%, transparent 62%),
    radial-gradient(760px 520px at -6% 112%, #ffe4d8 0%, transparent 60%),
    radial-gradient(500px 400px at 20% 10%, #f0fbff 0%, transparent 70%),
    #faf7ff;
}
.slide.active{opacity:1;visibility:visible;transition:opacity .6s ease .08s, transform .75s cubic-bezier(.2,.8,.2,1), visibility 0s}
.slide.dark{color:#fff;background:
    radial-gradient(1000px 700px at 85% -5%, rgba(167,139,250,.45), transparent 60%),
    radial-gradient(900px 600px at 0% 110%, rgba(18,181,166,.35), transparent 60%),
    linear-gradient(160deg,#2e1065 0%,#3b1a7a 45%,#0f5e78 100%);}

/* ظهور العناصر بالتتابع داخل الشريحة */
.rv{opacity:0}
.slide.active .rv{opacity:1;animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0) * 110ms + 220ms)}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(4deg)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes pulseOk{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}100%{box-shadow:0 0 0 26px rgba(22,163,74,0)}}

/* =====================================================================
   3) عناصر مشتركة: العناوين – الأزرار – البطاقات
   ===================================================================== */
.s-head{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin-bottom:26px;flex:none}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:26px;font-weight:800;padding:9px 24px;border-radius:999px;
  background:#fff;color:var(--chip,var(--p700));border:3px solid var(--chip,var(--p300));box-shadow:0 8px 20px -12px rgba(76,29,149,.4)}
.dark .chip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
h1{font-size:150px;font-weight:900;line-height:1.05;letter-spacing:-1px}
h2{font-size:64px;font-weight:900;line-height:1.15;color:var(--p800)}
.dark h2{color:#fff}
h3{font-size:36px;font-weight:900;color:var(--p800);margin-bottom:18px}
.body{flex:1;min-height:0;display:flex;flex-direction:column}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:30px;font-weight:800;padding:16px 34px;border-radius:999px;
  background:#fff;color:var(--p700);border:3px solid var(--p200);box-shadow:0 10px 24px -12px rgba(76,29,149,.45);
  transition:transform .2s, box-shadow .2s, background .2s, opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 30px -12px rgba(76,29,149,.5)}
.btn:active{transform:scale(.95)}
.btn.primary{background:linear-gradient(135deg,var(--p500),var(--p700));color:#fff;border-color:transparent}
.btn.sun{background:linear-gradient(135deg,#ffd76a,#ffb547);color:#4a2a00;border-color:transparent}
.btn.sea{background:linear-gradient(135deg,#2dd4bf,#0e9f9a);color:#fff;border-color:transparent}
.btn.glass{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.4);backdrop-filter:blur(6px)}
.btn.small{font-size:24px;padding:11px 24px}
.btn.big{font-size:40px;padding:24px 56px}
.btn:disabled{opacity:.4;pointer-events:none}

.card{background:#fff;border-radius:32px;box-shadow:var(--shadow);padding:30px 36px;border:2px solid #efe8ff}
.tip{font-size:26px;font-weight:700;color:var(--p700);background:var(--p100);border-radius:20px;padding:14px 22px;display:inline-block}
mark{background:linear-gradient(transparent 45%, #ffe08a 45%);color:inherit;padding:0 4px;border-radius:4px}

/* =====================================================================
   4) شريط التحكم + المؤشرات
   ===================================================================== */
#progress{position:absolute;top:0;left:0;right:0;height:8px;background:rgba(139,92,246,.15);z-index:50}
#progress i{position:absolute;top:0;right:0;height:100%;width:0;border-radius:0 0 0 8px;
  background:linear-gradient(270deg,var(--sun),var(--coral),var(--p500));transition:width .6s ease}
#controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;direction:ltr;
  padding:10px 12px;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  box-shadow:0 18px 40px -16px rgba(46,16,101,.55);border:2px solid #fff;z-index:60;transition:opacity .45s, transform .45s}
.cbtn{height:66px;min-width:66px;padding:0 26px;border-radius:999px;font-size:27px;font-weight:800;color:var(--p700);background:var(--p100);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s, background .2s}
.cbtn:hover{background:var(--p200)}
.cbtn:active{transform:scale(.92)}
.cbtn.next{background:linear-gradient(135deg,var(--p500),var(--p700));color:#fff}
.cbtn.icon{padding:0;width:66px;font-size:32px}
.cbtn.clap{background:#fff1d0;font-size:36px}
.cbtn.clap.pop{animation:beat .4s}
#counter{font-size:28px;font-weight:900;color:var(--p800);min-width:130px;text-align:center;direction:rtl}
.sep{width:2px;height:38px;background:var(--p200);margin:0 4px}
#hint{position:absolute;top:24px;left:28px;direction:rtl;font-size:20px;font-weight:700;color:var(--p700);
  background:rgba(255,255,255,.8);padding:8px 20px;border-radius:999px;z-index:60;transition:opacity .45s;box-shadow:0 6px 16px -10px rgba(46,16,101,.5)}
#hint b{background:var(--p100);padding:1px 10px;border-radius:8px;margin:0 3px}
body.idle #controls{opacity:0;transform:translate(-50%,46px);pointer-events:none}
body.idle #hint{opacity:0}
body.idle{cursor:none}

/* طبقة المؤثرات (التصفيق + القصاصات الملونة) */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:199}
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.clap-fx{position:absolute;animation:floatUp var(--dur) ease-out var(--delay) both;will-change:transform}
@keyframes floatUp{
  0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}
  15%{opacity:1;transform:translate(calc(var(--dx) * .2),-60px) scale(1.15) rotate(-12deg)}
  100%{opacity:0;transform:translate(var(--dx),-70vh) scale(.9) rotate(16deg)}}
.ghost{position:fixed;z-index:210;pointer-events:none;transform:translate(-50%,-50%) scale(var(--gs,1));opacity:.92}

/* =====================================================================
   5) النوافذ المنبثقة (القرعة – تعديل الأسماء)
   ===================================================================== */
.modal{position:absolute;inset:0;background:rgba(30,10,60,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
  z-index:80;opacity:0;visibility:hidden;transition:opacity .3s, visibility 0s linear .3s}
.modal.open{opacity:1;visibility:visible;transition:opacity .3s}
.modal-card{background:#fff;border-radius:40px;padding:48px 56px;width:960px;position:relative;transform:scale(.9);
  transition:transform .35s cubic-bezier(.2,.9,.3,1.3);box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.modal.open .modal-card{transform:none}
.m-close{position:absolute;top:20px;left:22px;width:62px;height:62px;border-radius:50%;background:var(--p100);font-size:36px;color:var(--p700)}
.modal textarea{width:100%;height:430px;font-size:30px;padding:20px 24px;border-radius:24px;border:3px solid var(--p200);resize:none;outline:none;
  -webkit-user-select:text;user-select:text;line-height:1.6;color:var(--ink)}
.modal-actions{display:flex;gap:16px;margin-top:22px;justify-content:center;flex-wrap:wrap}

/* ودجت قرعة الأسماء */
.draw{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%}
.draw-screen{width:100%;min-height:210px;border-radius:32px;background:linear-gradient(135deg,var(--p600),var(--p800));display:flex;align-items:center;
  justify-content:center;color:#fff;position:relative;overflow:hidden;box-shadow:inset 0 0 0 6px rgba(255,255,255,.14)}
.draw-screen::before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.12),transparent 30%);animation:spinSlow 6s linear infinite}
.draw-name{position:relative;font-size:92px;font-weight:900;text-align:center;padding:0 20px}
.draw-screen.spinning .draw-name{opacity:.8}
.draw-screen.chosen{animation:beat .6s}
.draw-screen.chosen .draw-name{color:var(--sun);text-shadow:0 0 34px rgba(255,200,74,.65)}
.draw-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.draw-opt{font-size:24px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:10px;cursor:pointer}
.draw-opt input{width:28px;height:28px;accent-color:var(--p600)}
.draw-meta{font-size:22px;color:var(--muted);font-weight:700}
.draw-hist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:96px;overflow:hidden}
.draw-hist span{font-size:20px;background:var(--p100);color:var(--p700);padding:4px 14px;border-radius:999px;font-weight:700}

/* =====================================================================
   6) بطاقات قابلة للقلب
   ===================================================================== */
.flip{perspective:1600px;cursor:pointer;position:relative}
.flip-in{position:absolute;inset:0;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.face.back{transform:rotateY(180deg)}

/* =====================================================================
   7) المؤقت – لوحة النقاط
   ===================================================================== */
.timer{display:flex;align-items:center;gap:18px}
.timer .ring{position:relative;width:150px;height:150px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr-bg{fill:none;stroke:var(--p100);stroke-width:11}
.tr-fg{fill:none;stroke:var(--p500);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1s linear, stroke .3s}
.t-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-txt b{font-size:40px;font-weight:900;color:var(--p800);direction:ltr}
.t-txt small{font-size:18px;color:var(--muted);font-weight:700}
.t-btns{display:flex;flex-direction:column;gap:10px}
.tbtn{width:62px;height:62px;border-radius:50%;background:var(--p100);color:var(--p700);font-size:28px;font-weight:900;transition:transform .15s}
.tbtn:hover{background:var(--p200)} .tbtn:active{transform:scale(.9)}
.tbtn.t-play{background:linear-gradient(135deg,var(--p500),var(--p700));color:#fff}
.timer.urgent .tr-fg{stroke:var(--coral)} .timer.urgent b{color:var(--coral);animation:beat 1s infinite}
.timer.over b{color:var(--bad)}
.timer.big .ring{width:220px;height:220px} .timer.big .t-txt b{font-size:64px} .timer.big .t-txt small{font-size:24px}
.dark .tr-bg{stroke:rgba(255,255,255,.15)} .dark .t-txt b{color:#fff}

.scores{display:flex;flex-direction:column;gap:14px}
.sc{display:flex;align-items:center;gap:16px;background:#fff;border-radius:24px;padding:12px 18px;border-right:12px solid var(--c);box-shadow:0 10px 26px -18px rgba(46,16,101,.6)}
.sc-ic{font-size:42px}
.sc-n{font-size:32px;font-weight:900;flex:1}
.sc-v{font-size:50px;font-weight:900;color:var(--c);min-width:84px;text-align:center}
.sc-v.bump{animation:pop .4s}
.sc button{width:56px;height:56px;border-radius:50%;font-size:32px;font-weight:900;background:var(--p50);color:var(--c);border:3px solid var(--c)}
.sc button.sc-p{background:var(--c);color:#fff}

/* =====================================================================
   8) أسئلة الاختيار من متعدد
   ===================================================================== */
.mcq-q{font-size:44px;font-weight:800;line-height:1.5;color:var(--p800);display:flex;align-items:center;gap:26px}
.mcq-visual{font-size:96px;flex:none;animation:floaty 4s ease-in-out infinite}
.mcq-opts{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:32px}
.opt{display:flex;align-items:center;gap:20px;font-size:40px;font-weight:800;padding:22px 30px;background:#fff;border:4px solid var(--p200);border-radius:30px;
  box-shadow:0 12px 28px -18px rgba(76,29,149,.6);transition:transform .2s, border-color .2s, background .2s, opacity .3s;text-align:right;color:var(--ink)}
.opt:hover{border-color:var(--p400);transform:translateY(-4px)}
.opt:active{transform:scale(.97)}
.opt-ic{font-size:50px;width:86px;height:86px;display:grid;place-items:center;background:var(--p50);border-radius:22px;flex:none}
.opt.correct{border-color:var(--ok);background:var(--okbg);animation:pulseOk .8s}
.opt.correct::after{content:'✔';margin-right:auto;font-size:46px;color:var(--ok)}
.opt.wrong{animation:shake .5s;border-color:#f9a8d4}
.opt.tried{opacity:.55}
.opt.dim{opacity:.4}
.mcq-opts.compact{gap:14px;margin-top:18px}
.mcq-opts.compact .opt{font-size:30px;padding:12px 18px;border-radius:22px}
.mcq-opts.compact .opt-ic{width:58px;height:58px;font-size:34px;border-radius:16px}
.mcq.compact-q .mcq-q{font-size:32px}
.compact-q .feedback{min-height:0;margin-top:10px;font-size:32px}
.compact-q .explain{font-size:24px}
.feedback{min-height:64px;margin-top:20px;font-size:40px;font-weight:900;text-align:center;opacity:0;transform:scale(.85);transition:opacity .3s, transform .3s}
.feedback.show{opacity:1;transform:none}
.feedback.ok{color:var(--ok)} .feedback.bad{color:#a21caf}
.explain{display:none;font-size:30px;font-weight:700;text-align:center;color:var(--p700);background:var(--p100);border-radius:22px;padding:14px 24px;margin-top:8px}
.explain.show{display:block;animation:rise .5s}
.mcq-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1560px;width:100%;margin:0 auto}
.ask-btn{position:absolute;top:120px;left:96px}

/* =====================================================================
   9) تنسيقات الشرائح حسب النوع
   ===================================================================== */
/* --- الترحيب --- */
.t-welcome,.t-closing{align-items:center;justify-content:center;text-align:center;padding-bottom:120px}
.welcome-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:26px}
.w-star{width:230px;height:230px;animation:floaty 5s ease-in-out infinite}
.w-star svg{width:100%;height:100%;animation:spinSlow 40s linear infinite;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35))}
.t-welcome h1{background:linear-gradient(90deg,#fff,#ffe6a8,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.w-sub{font-size:46px;font-weight:700;opacity:.95}
.w-steam{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.w-steam span{font-size:28px;font-weight:800;padding:10px 24px;border-radius:999px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3)}
.w-steam b{color:var(--sun);font-size:32px;margin-left:6px;font-family:Arial,sans-serif}
.w-teacher{font-size:30px;opacity:.85;font-weight:700}
.bubbles{position:absolute;inset:0;overflow:hidden;z-index:1;pointer-events:none}
.bubbles i{position:absolute;bottom:-60px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.45),rgba(255,255,255,.04) 60%);
  animation:bubble linear infinite}
@keyframes bubble{0%{transform:translate(0,0)}50%{transform:translate(18px,-55vh)}100%{transform:translate(-10px,-115vh)}}

/* --- التحضير --- */
.prep{display:flex;flex-direction:column;gap:22px;flex:1;min-height:0}
.prep-hint{font-size:26px;color:var(--muted);font-weight:700}
.mini-flips{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;flex:1;min-height:0}
.mini-flips .flip{min-height:340px}
.mini-flips .front{background:#fff;border:3px solid var(--p200);box-shadow:0 12px 26px -18px rgba(76,29,149,.6)}
.mini-flips .front .ic{font-size:64px}
.mini-flips .front .q{font-size:34px;font-weight:800;line-height:1.5;color:var(--p800)}
.mini-flips .front .n{font-size:24px;font-weight:900;color:#fff;background:var(--p700);border-radius:12px;padding:2px 16px}
.mini-flips .back{background:linear-gradient(135deg,#7c3aed,#4c1d95);color:#fff}
.mini-flips .back .a{font-size:27px;font-weight:700;line-height:1.55;text-align:right;direction:rtl}
.mini-flips .back ul,.mini-flips .back ol{margin:0;padding-right:28px;display:flex;flex-direction:column;gap:10px}
.mini-flips .back ul{list-style:none;padding-right:0}
.mini-flips .back ol{list-style:arabic-indic}
.mini-flips .back small{font-size:21px;opacity:.9}
.xl-head{display:flex;align-items:center;gap:14px}
.xl-logo{width:56px;height:56px;border-radius:14px;background:#1d7a45;color:#fff;font:900 34px Arial,sans-serif;display:grid;place-items:center}

/* --- الأهداف --- */
.goals-wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:50px;flex:1;min-height:0;align-items:center}
.goals{list-style:none;display:flex;flex-direction:column;gap:18px}
.goal{display:flex;align-items:center;gap:24px;font-size:34px;font-weight:700;background:#fff;border-radius:28px;padding:18px 28px;
  box-shadow:0 12px 30px -20px rgba(76,29,149,.7);cursor:pointer;border:3px solid transparent;transition:border-color .25s, transform .25s}
.goal:hover{transform:translateX(-8px);border-color:var(--p200)}
.g-ic{font-size:42px;width:76px;height:76px;border-radius:22px;background:var(--p100);display:grid;place-items:center;flex:none}
.g-check{margin-right:auto;width:52px;height:52px;border-radius:50%;border:3px dashed var(--p300);display:grid;place-items:center;color:transparent;font-size:30px;flex:none;transition:.3s}
.goal.done{border-color:#bbf7d0}
.goal.done .g-check{background:var(--ok);border:3px solid var(--ok);color:#fff;animation:pop .4s}
.goals-side{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.goals-side .w-star{width:300px;height:300px}
.goals-side p{font-size:32px;font-weight:800;color:var(--p700);line-height:1.5}

/* --- أسئلة نافس --- */
.nafes{display:grid;grid-template-columns:.9fr 1.6fr;gap:40px;flex:1;min-height:0;align-items:center}
.nafes.no-img{grid-template-columns:1fr}
.nf-fig{display:grid;place-items:center;padding:24px;background:#fff}
.nf-fig img{width:100%;max-height:520px;object-fit:contain}
.nafes .mcq.compact-q .mcq-q{font-size:40px}
.nafes .mcq-opts.compact .opt{font-size:34px;padding:16px 22px}
.cells{display:inline-grid;grid-template-columns:repeat(2,auto);gap:4px}
.cells i{font-style:normal;display:grid;place-items:center;width:84px;height:84px;border-radius:50%;font-size:28px;font-weight:900;color:var(--p800);
  background:radial-gradient(circle at 40% 35%,#fff,#c9c3f5 70%);border:3px solid #9d93e6}
.cells.c4 i{width:62px;height:62px;font-size:22px}

/* --- السؤال المحوري --- */
.pivot{display:flex;flex-direction:column;gap:26px;flex:1;min-height:0;justify-content:center}
.pv-bridge{display:flex;align-items:center;justify-content:center;gap:30px}
.pv-b{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:24px;padding:14px 28px;font-size:30px}
.pv-b small{font-size:24px;opacity:.85;font-weight:700}
.pv-ic{font-size:44px}
.pv-eq{font-size:44px;color:#ffd76a;font-weight:900}
.pv-q{background:#fff;color:var(--p800);border-radius:34px;padding:34px 46px;text-align:center;box-shadow:0 30px 60px -24px rgba(0,0,0,.55);border-bottom:8px solid #ffb547}
.pv-lead{font-size:34px;font-weight:700;color:var(--muted);margin-bottom:10px}
.pv-main{font-size:46px;font-weight:900;line-height:1.55}
.pv-main mark{background:linear-gradient(transparent 55%,#ffd76a 55%);color:inherit;padding:0 4px}
.pv-board{display:flex;flex-direction:column;gap:16px}
.pv-add{display:flex;gap:12px;align-items:center}
.pv-add input{flex:1;font:inherit;font-size:26px;font-weight:700;padding:14px 22px;border-radius:18px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.95);color:var(--ink)}
.pv-ideas{display:flex;flex-wrap:wrap;gap:14px;min-height:64px}
.pv-idea{font-size:26px;font-weight:800;background:#ffd76a;color:#4a2a00;border-radius:999px;padding:10px 24px;cursor:pointer;animation:pop .4s}
.pv-idea.sugg{background:rgba(255,255,255,.92);color:var(--p800)}

/* --- مشهد الرسم p5 --- */
.stage-canvas{position:relative;border-radius:36px;overflow:hidden;box-shadow:0 30px 60px -24px rgba(0,0,0,.55);border:6px solid rgba(255,255,255,.3);background:#0b4f7a}
.stage-canvas .cv{position:absolute;inset:0}
.stage-canvas canvas{display:block;width:100%!important;height:100%!important}
.caption{position:absolute;top:20px;right:20px;max-width:68%;background:rgba(255,255,255,.94);color:var(--p800);font-size:28px;font-weight:800;
  padding:14px 26px;border-radius:22px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);line-height:1.45;z-index:3}
.caption:empty{display:none}
.caption.flash{animation:pop .5s}
.cv-ctrl{position:absolute;bottom:18px;right:18px;display:flex;gap:12px;z-index:3}
.cv-badge{position:absolute;bottom:18px;left:18px;z-index:3;background:rgba(255,255,255,.94);color:var(--p800);font-size:28px;font-weight:900;padding:12px 24px;border-radius:20px}
.cv-badge b{font-size:38px;color:var(--coral)}
.nop5{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:30px;font-weight:700;padding:40px;line-height:1.6;z-index:4}
.no-p5 .nop5{display:flex}

/* --- التمهيد --- */
.hook{display:grid;grid-template-columns:1.62fr 1fr;gap:40px;flex:1;min-height:0;align-items:center}
.hook .stage-canvas{aspect-ratio:1200/700;width:100%}
.hook-side{display:flex;flex-direction:column;gap:18px}
.q-bubble{font-size:36px;font-weight:800;line-height:1.5;background:#fff;color:var(--p800);border-radius:30px;padding:24px 30px;position:relative;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.q-bubble::after{content:'';position:absolute;bottom:-18px;right:60px;border:18px solid transparent;border-top-color:#fff;border-bottom:0}
.votes{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.vote{position:relative;overflow:hidden;width:100%;display:flex;justify-content:space-between;align-items:center;font-size:30px;font-weight:800;padding:16px 26px;
  border-radius:22px;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.3);color:#fff;transition:transform .2s, border-color .3s}
.vote:hover{transform:translateX(-6px)} .vote:active{transform:scale(.97)}
.vote>span,.vote>b{position:relative;z-index:1}
.vote b{font-size:34px;color:var(--sun);min-width:40px;text-align:center}
.vote .bar{position:absolute;top:0;bottom:0;right:0;width:0;background:rgba(255,200,74,.22);transition:width .4s;z-index:0}
.vote.correct{border-color:#4ade80;background:rgba(74,222,128,.22)}
.vote.correct span::after{content:' ✔';color:#4ade80}
.small-note{font-size:22px;opacity:.8;font-weight:700}
.reveal-box{display:none;font-size:30px;font-weight:700;line-height:1.55;background:linear-gradient(135deg,#ffd76a,#ffb547);color:#4a2a00;border-radius:26px;padding:20px 26px}
.reveal-box.show{display:block;animation:rise .6s}

/* --- المفهوم --- */
.concept{display:grid;grid-template-columns:1.12fr 1fr;gap:40px;flex:1;min-height:0}
.concept .col{display:flex;flex-direction:column;gap:24px;min-height:0}
.def{font-size:36px;line-height:1.75;font-weight:500}
.def .en{direction:ltr;text-align:left;font-size:24px;color:var(--muted);font-weight:700;margin-top:6px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rcard{border-radius:28px;padding:22px;text-align:center;cursor:pointer;background:#fff;border:3px dashed var(--p300);min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:10px;transition:.3s}
.rcard .rt{font-size:30px;font-weight:900;color:var(--p800)}
.rcard .rd{font-size:28px;font-weight:700;display:none}
.rcard .rh{font-size:22px;color:var(--muted)}
.rcard.on{border-style:solid;background:var(--p100)}
.rcard.on .rd{display:block;animation:pop .45s}
.rcard.on .rh{display:none}
.rcard.alt.on{background:#fff1ea;border-color:var(--coral)}
.copy-vis{display:flex;align-items:center;justify-content:center;gap:26px;padding:22px}
.copy-vis .big svg{width:115px;height:115px}
.copy-vis .arrow{font-size:70px;color:var(--p500);animation:floaty 2s ease-in-out infinite}
.copy-vis .kids{display:flex;gap:10px}
.copy-vis .kids svg{width:72px;height:72px}
.slide.active .copy-vis .kids span{animation:pop .6s backwards}
.lbl{font-size:26px;font-weight:800;color:var(--p700);text-align:center}

/* --- بطاقات الأنواع --- */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;flex:1;min-height:0;max-height:640px}
.types .front{background:linear-gradient(160deg,var(--c),var(--c2));color:#fff;box-shadow:0 26px 40px -24px var(--c)}
.types .front .ic{font-size:110px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;animation:floaty 4s ease-in-out infinite}
.types .front .nm{font-size:46px;font-weight:900}
.types .front .hint{font-size:22px;opacity:.85;font-weight:700}
.types .back{background:#fff;border:5px solid var(--c);color:var(--ink);justify-content:flex-start;padding-top:36px}
.types .back .nm{font-size:40px;font-weight:900;color:var(--c)}
.types .back .ds{font-size:28px;line-height:1.6;font-weight:600}
.types .back .ex{margin-top:auto;font-size:26px;font-weight:800;background:var(--p50);border-radius:18px;padding:12px 16px;color:var(--p800)}
.types-note{margin-top:22px;text-align:center}

/* --- العصف الذهني --- */
.brain{flex:1;position:relative;min-height:0}
.board{position:absolute;inset:0 0 100px 0}
.brain-center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:600px;padding:34px 40px;border-radius:50%/44%;text-align:center;
  background:linear-gradient(135deg,var(--p500),var(--p700));color:#fff;box-shadow:0 30px 60px -24px rgba(91,33,182,.8);z-index:2}
.brain-center .bi{font-size:72px;display:block;animation:beat 2.4s infinite}
.brain-center p{font-size:36px;font-weight:800;line-height:1.45}
.note{position:absolute;width:310px;min-height:110px;padding:24px 22px 18px;font-size:27px;font-weight:800;line-height:1.4;background:var(--bg);border-radius:8px 8px 26px 8px;
  box-shadow:0 18px 30px -18px rgba(0,0,0,.45);transform:translate(-50%,-50%) rotate(var(--rot));z-index:3;animation:noteIn .55s cubic-bezier(.2,.9,.3,1.3)}
.note::before{content:'';position:absolute;top:-14px;left:50%;width:90px;height:28px;margin-left:-45px;background:rgba(255,255,255,.65);transform:rotate(-3deg);border-radius:4px}
.note .x{position:absolute;top:4px;left:6px;width:34px;height:34px;border-radius:50%;font-size:22px;color:rgba(0,0,0,.4)}
@keyframes noteIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-20deg)}}
.brain-bar{position:absolute;bottom:0;left:0;right:0;display:flex;gap:14px;justify-content:center;align-items:center}
.brain-bar input{width:720px;font-size:30px;padding:16px 28px;border-radius:999px;border:3px solid var(--p200);outline:none;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.brain-bar input:focus{border-color:var(--p500)}

/* --- فكر زاوج شارك --- */
.tps{display:grid;grid-template-columns:1fr 1.22fr;gap:36px;flex:1;min-height:0;align-items:center}
.tps-left{display:flex;flex-direction:column;gap:20px}
.problem{font-size:31px;line-height:1.65;font-weight:600}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.phase{background:#fff;border:3px solid var(--p200);border-radius:24px;padding:12px;text-align:center;transition:.25s}
.phase .pi{font-size:44px;display:block}
.phase .pn{font-size:30px;font-weight:900;color:var(--p800);display:block}
.phase .pt{font-size:19px;color:var(--muted);font-weight:700}
.phase.on{border-color:var(--p500);background:var(--p100);transform:translateY(-6px);box-shadow:0 16px 30px -18px rgba(91,33,182,.8)}
.tps-row{display:flex;align-items:center;gap:24px;justify-content:space-between}
.answer{display:none;font-size:28px;font-weight:700;line-height:1.6;background:linear-gradient(135deg,#fff7d6,#ffe9b0);border-radius:24px;padding:18px 24px;border:3px solid #ffd76a}
.answer.show{display:block;animation:rise .5s}
.tps .stage-canvas{aspect-ratio:1200/700;width:100%}
.tps .problem{font-size:27px;padding:22px 28px}
.tps .phase{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px}
.tps .phase .pi{font-size:38px}
.tps .phase .pn{font-size:28px}
.tps .timer .ring{width:118px;height:118px}
.tps .t-txt b{font-size:32px}
.tps .answer{font-size:26px}

/* --- STEAM --- */
.steam-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;flex:1;min-height:0}
.sg{background:#fff;border-radius:30px;border-top:16px solid var(--c);padding:22px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;
  box-shadow:var(--shadow);transition:transform .25s}
.sg:hover{transform:translateY(-8px)}
.sg-letter{font:900 92px/1 'Arial Black',Arial,sans-serif;color:var(--c)}
.sg-ic{font-size:56px;animation:floaty 4s ease-in-out infinite}
.sg-name{font-size:38px;font-weight:900;color:var(--c)}
.sg-task{font-size:24px;line-height:1.55;color:var(--ink);font-weight:600;flex:1}
.sg-prod{font-size:20px;font-weight:800;color:var(--muted);background:var(--p50);border-radius:14px;padding:6px 12px}
.sg .btn{background:var(--c);color:#fff;border-color:transparent;font-size:24px;padding:12px 22px}
.steam-foot{display:flex;align-items:center;justify-content:center;gap:40px;margin-top:20px}

/* شارة المجموعة في محطات STEAM */
.station-top{display:flex;align-items:center;justify-content:space-between}

/* --- التصنيف (العلوم) --- */
.sort{flex:1;display:flex;flex-direction:column;gap:26px;min-height:0}
.items{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;min-height:84px;align-items:center}
.item{font-size:32px;font-weight:800;padding:14px 28px;border-radius:999px;background:#fff;border:3px solid var(--p200);display:flex;gap:12px;align-items:center;
  touch-action:none;box-shadow:0 10px 22px -16px rgba(76,29,149,.7);transition:transform .2s, border-color .2s, background .2s}
.item:hover{transform:translateY(-4px)}
.item.sel{border-color:var(--p600);background:var(--p100);transform:scale(1.08)}
.item.wrong{animation:shake .5s;border-color:#f9a8d4}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;flex:1;min-height:0}
.bin{border:4px dashed var(--c);border-radius:32px;background:rgba(255,255,255,.75);padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.25s}
.bin:hover,.bin.hover{background:#fff;transform:translateY(-4px)}
.bin.wrong{animation:shake .5s}
.bin.good{box-shadow:0 0 0 8px rgba(22,163,74,.25)}
.bin-i{font-size:60px}
.bin-h{font-size:34px;font-weight:900;color:var(--c)}
.bin-s{font-size:21px;color:var(--muted);font-weight:700;margin-top:-6px}
.bin-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.bin-list span{font-size:26px;font-weight:800;background:var(--c);color:#fff;padding:8px 18px;border-radius:999px;animation:pop .4s}
.sort-foot{display:flex;align-items:center;justify-content:center;gap:24px}
.sort-foot .feedback{margin:0;min-height:0}

/* --- المختبر الرقمي (التقنية) --- */
.lab{display:grid;grid-template-columns:1.55fr 1fr;gap:34px;flex:1;min-height:0;align-items:center}
.lab .stage-canvas{aspect-ratio:1100/680;width:100%;background:#203048}
.lab-side{display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:10px;background:var(--p100);padding:8px;border-radius:999px}
.tab{flex:1;font-size:25px;font-weight:800;padding:13px 10px;border-radius:999px;color:var(--p700);transition:.25s}
.tab.on{background:#fff;box-shadow:0 8px 20px -12px rgba(76,29,149,.7)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{background:#fff;border-radius:24px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:56px;font-weight:900;color:var(--sea);line-height:1.1}
.stat span{font-size:22px;font-weight:800;color:var(--muted)}
.lab-btns{display:flex;gap:10px;flex-wrap:wrap}
.lab-task{font-size:24px;line-height:1.55;font-weight:600}
.rec{width:100%;border-collapse:collapse;direction:ltr;font:700 22px Arial,sans-serif;background:#fff;border-radius:14px;overflow:hidden}
.rec th,.rec td{border:1px solid #d5dbe3;padding:5px 10px;text-align:center}
.rec th{background:#1d7a45;color:#fff;font-family:var(--font)}
.rec td:first-child{background:#eef3f7;color:#667;width:42px}

/* --- الهندسة: ترتيب المراحل --- */
.eng{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;flex:1;min-height:0}
.order-list{display:flex;flex-direction:column;gap:16px}
.stage-card{display:flex;align-items:center;gap:22px;font-size:32px;font-weight:800;background:#fff;border:4px solid var(--p200);border-radius:26px;padding:16px 24px;text-align:right;
  box-shadow:0 12px 26px -18px rgba(76,29,149,.7);transition:.25s;color:var(--ink)}
.stage-card:hover{border-color:var(--c)}
.stage-card .num{width:62px;height:62px;border-radius:50%;border:3px dashed var(--p300);display:grid;place-items:center;font-size:32px;font-weight:900;flex:none;color:transparent}
.stage-card .si{font-size:46px}
.stage-card.done{border-color:var(--ok);background:var(--okbg);pointer-events:none}
.stage-card.done .num{background:var(--ok);border:3px solid var(--ok);color:#fff;animation:pop .4s}
.stage-card.wrong{animation:shake .5s;border-color:#f9a8d4}
.exp{display:flex;flex-direction:column;gap:12px}
.exp h3{margin-bottom:4px}
.exp ol{padding-right:36px;font-size:27px;line-height:1.6;font-weight:600}
.exp .tag{font-size:26px;font-weight:900;color:var(--c)}
.qa{display:flex;flex-direction:column;gap:10px}
.qa-item{background:var(--p50);border-radius:20px;padding:12px 18px;font-size:26px;font-weight:700;cursor:pointer;border:2px solid var(--p100)}
.qa-item .ans{display:none;color:var(--ok);font-weight:900;margin-top:4px}
.qa-item.on .ans{display:block;animation:pop .4s}
.qa-item .hint{font-size:19px;color:var(--muted)}
.qa-item.on .hint{display:none}

/* --- الفنون: لوحة الرسم --- */
.art{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:30px;flex:1;min-height:0;align-items:center}
.art-main{display:flex;flex-direction:column;gap:18px;min-width:0;align-items:center}
.pad-wrap{position:relative;aspect-ratio:1200/640;width:100%;max-width:1150px;justify-self:center;border-radius:30px;overflow:hidden;background:#fff;box-shadow:var(--shadow);border:5px solid #fde2f0}
.pad-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pad-grid{position:absolute;inset:0;pointer-events:none;display:none;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.pad-grid.on{display:grid}
.pad-grid div{border:3px dashed #f3b4d6;position:relative}
.pad-grid div span{position:absolute;top:10px;right:14px;font-size:30px;font-weight:900;color:#ef5da8;background:#fff0f7;width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.tools{display:flex;flex-direction:column;gap:14px}
.tools .card{padding:18px 20px}
.tool-t{font-size:22px;font-weight:900;color:var(--muted);margin-bottom:8px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{aspect-ratio:1;border-radius:50%;background:var(--c);border:4px solid #fff;box-shadow:0 0 0 2px #ddd;transition:transform .15s}
.sw.on{box-shadow:0 0 0 4px var(--p600);transform:scale(1.12)}
.sizes,.stamps{display:flex;gap:10px;flex-wrap:wrap}
.sz,.st{width:52px;height:52px;border-radius:16px;background:var(--p50);display:grid;place-items:center;border:3px solid transparent;font-size:30px}
.sz.on,.st.on{border-color:var(--p600);background:var(--p100)}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.art-task{font-size:23px;line-height:1.6;font-weight:700}
.pad-fold{position:absolute;inset:0 50% 0 auto;width:0;border-left:4px dashed #ef5da8;pointer-events:none;display:none}
.pad-fold.on{display:block}
.fold-flap{position:absolute;top:0;bottom:0;right:0;width:50%;transform-origin:left center;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(239,93,168,.18),rgba(255,240,247,.9));border-radius:0 24px 24px 0}
.fold-flap.go{animation:foldFlap 1.4s ease-in-out}
@keyframes foldFlap{0%{opacity:.95;transform:perspective(1400px) rotateY(0)}45%,55%{opacity:.95;transform:perspective(1400px) rotateY(-178deg)}100%{opacity:0;transform:perspective(1400px) rotateY(0)}}
.fold-card{width:100%;max-width:1150px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 22px;padding:16px 24px;border:3px solid #fde2f0}
.fold-t{font-size:26px;color:#db2777}
.eng-tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.eng-tools span{font-size:24px;font-weight:800;background:#fff4e8;color:#9a4a0c;border:2px solid #fcd9b6;border-radius:999px;padding:6px 18px}
.fold-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;padding:0;list-style:none;counter-reset:fs}
.fold-steps li{counter-increment:fs;font-size:20px;font-weight:700;background:#fff0f7;border-radius:14px;padding:6px 12px}
.fold-steps li::before{content:counter(fs, arabic-indic) ' ';color:#db2777;font-weight:900}
.fold-link{grid-column:1/-1;font-size:21px;font-weight:800;color:var(--p700);margin:0}
.art .btn.small{font-size:21px;padding:10px 16px}
.tools .stamps{margin-top:10px}

/* --- الرياضيات --- */
.math{display:grid;grid-template-columns:1fr 1.08fr;gap:36px;flex:1;min-height:0}
.math .card{display:flex;flex-direction:column;min-height:0}
.explore{gap:12px}
.range-row{display:flex;align-items:center;gap:18px;font-size:28px;font-weight:800}
.range-row input{flex:1;accent-color:var(--p600);height:36px}
.big-count{display:flex;align-items:baseline;gap:14px;font-size:30px;font-weight:800;color:var(--muted)}
.big-count b{font-size:76px;color:var(--sea);line-height:1}
.pattern{font-size:28px;font-weight:800;color:var(--p700);direction:rtl}
.math-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.dots{width:100%;max-width:330px;aspect-ratio:1/1;background:#f1fbf6;border-radius:20px;border:2px solid #cdeedd}
.sheet{direction:ltr;font:700 21px Arial,sans-serif;border:2px solid #cfd6de;border-radius:12px;overflow:hidden;background:#fff;align-self:start}
.fx-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f3f6f9;border-bottom:2px solid #cfd6de;color:#1d7a45}
.fx-bar i{font-style:italic;color:#666}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{border:1px solid #dde2e8;padding:3px 8px;text-align:center;height:30px}
.sheet th{background:#eef3f7;color:#667;font-weight:700}
.sheet tr td:first-child{background:#eef3f7;color:#667;width:34px}
.sheet .hdr td{background:#1d7a45;color:#fff;font-family:var(--font);font-size:19px}
.sheet .hdr td:first-child{background:#eef3f7;color:#667}
.sheet tr.cur td:last-child{outline:3px solid #1d7a45;outline-offset:-3px;background:#e8f7ee}

/* --- صح أم خطأ --- */
.tf{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.tf-card{width:1400px;min-height:250px;font-size:52px;font-weight:800;line-height:1.5;text-align:center;display:flex;align-items:center;justify-content:center;
  border:5px solid var(--p200);transition:border-color .3s, background .3s}
.tf-card.ok{border-color:var(--ok);background:#f2fdf5}
.tf-card.swap{animation:rise .55s}
.tf-btns{display:flex;gap:40px}
.tf-btn{font-size:50px;font-weight:900;width:330px;padding:24px;border-radius:30px;color:#fff;box-shadow:0 20px 34px -18px rgba(0,0,0,.5);transition:transform .2s}
.tf-btn:hover{transform:translateY(-5px)} .tf-btn:active{transform:scale(.95)}
.tf-btn.t{background:linear-gradient(135deg,#34d399,#16a34a)}
.tf-btn.f{background:linear-gradient(135deg,#fb7185,#db2777)}
.tf-btn.wrong{animation:shake .5s}
.tf-fix{font-size:30px;font-weight:700;color:var(--p700);background:var(--p100);border-radius:20px;padding:12px 26px;display:none}
.tf-fix.show{display:block;animation:rise .45s}
.tf-foot{display:flex;align-items:center;gap:26px}
.dotsbar{display:flex;gap:10px}
.dotsbar i{width:20px;height:20px;border-radius:50%;background:var(--p200)}
.dotsbar i.cur{background:var(--p600);transform:scale(1.25)}
.dotsbar i.ok{background:var(--ok)}

/* --- تحدي الدقيقة --- */
.minute{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;flex:1;min-height:0;align-items:center}
.minute-left{display:flex;flex-direction:column;align-items:center;gap:24px;text-align:center}
.minute-left .prompt{font-size:32px;font-weight:800;line-height:1.55}
.ans-list{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ans-list span{font-size:26px;font-weight:800;background:#fff;border:3px solid var(--p200);padding:8px 18px;border-radius:999px;animation:pop .4s backwards}

/* --- المراجعة: خريطة مفاهيم --- */
.map{position:relative;flex:1;min-height:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map line{stroke:var(--p300);stroke-width:6;stroke-dasharray:14 12;stroke-linecap:round;opacity:0;transition:opacity .6s}
.map line.on{opacity:1}
.mnode{position:absolute;transform:translate(-50%,-50%);width:430px;min-height:150px;padding:20px 24px;border-radius:30px;background:#fff;border:4px dashed var(--p300);
  text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);transition:transform .3s}
.mnode:hover{transform:translate(-50%,-50%) scale(1.03)}
.mnode .q{font-size:70px;font-weight:900;color:var(--p300)}
.mnode .c{display:none}
.mnode.on{border:5px solid var(--c);}
.mnode.on .q{display:none}
.mnode.on .c{display:flex;flex-direction:column;align-items:center;gap:4px;animation:pop .45s}
.mnode .mi{font-size:50px} .mnode .mt{font-size:36px;font-weight:900;color:var(--c)} .mnode .me{font-size:24px;font-weight:700;color:var(--muted)}
.mcenter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;padding:30px;border-radius:40px;text-align:center;color:#fff;
  background:linear-gradient(135deg,var(--p500),var(--p700));box-shadow:0 30px 60px -24px rgba(91,33,182,.85);z-index:2}
.mcenter b{display:block;font-size:46px;font-weight:900} .mcenter span{font-size:28px;font-weight:700;opacity:.92}
.map-foot{position:absolute;bottom:0;left:50%;transform:translateX(-50%)}

/* --- التقييم الفوري --- */
.assess{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;flex:1;min-height:0}
.ticket{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;border-top:14px solid var(--c)}
.ticket .n{width:110px;height:110px;border-radius:50%;background:var(--c);color:#fff;font-size:64px;font-weight:900;display:grid;place-items:center;box-shadow:0 16px 30px -14px var(--c)}
.ticket .tt{font-size:34px;font-weight:900;color:var(--ink);line-height:1.4}
.ticket .ts{font-size:24px;color:var(--muted);font-weight:700;line-height:1.5}
.mood{display:flex;justify-content:center;gap:26px;margin-top:24px}
.mood button{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:800;background:#fff;border:3px solid var(--p200);border-radius:999px;padding:12px 28px;transition:.2s;box-shadow:var(--shadow)}
.mood button:hover{transform:translateY(-4px)}
.mood button .e{font-size:48px}
.mood button b{font-size:36px;color:var(--p600);min-width:36px}

/* --- الختام --- */
.closing{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:24px}
.closing h1{font-size:110px}
.closing .msg{font-size:44px;font-weight:700;line-height:1.6;max-width:1400px}
.winner{font-size:36px;font-weight:900;color:var(--sun)}
.closing-btns{display:flex;gap:20px}
.mdr{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;background:#fff;color:var(--p800);border-radius:26px;padding:16px 28px;border-bottom:6px solid #ffb547;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.mdr b{font-size:34px;font-weight:900;color:#0e7c86}
.mdr span{font-size:30px;font-weight:800;background:var(--p50);border-radius:16px;padding:8px 18px}
</style>
</head>

<div id="stage">

  <div id="hint">
    <b>Space</b> = التالي &nbsp;|&nbsp; <b>← →</b> للتنقل &nbsp;|&nbsp; <b>ت</b> = تصفيق &nbsp;|&nbsp; <b>ق</b> = قرعة

  <!-- نافذة القرعة السريعة (تفتح من أي شريحة) -->
  <div class="modal" id="drawModal">
    <div class="modal-card">
      <button class="m-close" data-close>×</button>
      <h3>🎲 قرعة الأسماء: من تجيب الآن؟</h3>
      <div class="draw-slot"></div>
    </div>
  </div>

        <button class="btn primary" id="namesSave">💾 حفظ الأسماء</button>
        <button class="btn" id="namesDefault">↺ الأسماء الافتراضية</button>
      </div>
    </div>
  </div>
</div>

/* رسم نجم بحر SVG ثابت (للترحيب والأهداف والمفهوم) */
let svgId = 0;
function starSVG(color1 = '#ffb27a', color2 = '#e8553a') {
  const id = 'sg' + (svgId++), S = 2 * Math.PI / 5;
  let d = '';
  for (let i = 0; i <= 180; i++) {
    const th = i / 180 * 2 * Math.PI, n = Math.round(th / S), dd = th - n * S;
    const r = 30 + 66 * Math.pow(Math.max(0, Math.cos(dd * 2.5)), 1.5);
    d += (i ? 'L' : 'M') + (100 + r * Math.sin(th)).toFixed(1) + ' ' + (100 - r * Math.cos(th)).toFixed(1);
  }
  let dots = '';
  for (let k = 0; k < 5; k++) for (let j = 1; j <= 4; j++) {
    const a = k * S, rr = 26 + j * 15, rad = 5.5 - j;
    dots += `<circle cx="${(100 + rr * Math.sin(a)).toFixed(1)}" cy="${(100 - rr * Math.cos(a)).toFixed(1)}" r="${rad}" fill="#fff3d6" opacity=".85"/>`;
  }
  return `<svg viewBox="0 0 200 200"><defs><radialGradient id="${id}" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="${color1}"/><stop offset="1" stop-color="${color2}"/></radialGradient></defs>
  <path d="${d}Z" fill="url(#${id})" stroke="#b93a22" stroke-width="3" stroke-linejoin="round"/>${dots}<circle cx="100" cy="100" r="11" fill="#ffd9b0"/></svg>`;
}


/* =====================================================================

   ===================================================================== */
const Sound = (() => {
  let ctx, master, noise;
  function ac() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master = ctx.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 0.3);
      noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(f, t, dur, { type = 'sine', vol = 0.25, slide = 0 } = {}) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  // صفقة واحدة = نبضة ضجيج قصيرة عبر مرشّح
  function clapHit(t, vol) {
    const src = ctx.createBufferSource(); src.buffer = noise;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(1000, 2500); bp.Q.value = rand(0.7, 1.5);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 500;
    const g = ctx.createGain(), d = rand(0.06, 0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.003);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(master);
    src.start(t, rand(0, 0.15), d + 0.02);
  }
  return {
    clap() {               // تصفيق جماعي (عدة صفقات عشوائية التوقيت)
      if (!ac()) return;
      const now = ctx.currentTime + 0.02;
      for (let i = 0; i < 48; i++) { const r = Math.random(); clapHit(now + r * r * 1.8, rand(0.18, 0.45) * (1 - r * 0.5)); }
    },
    success() {            // صوت نجاح: نغمات صاعدة
      if (!ac()) return; const t = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.09, 0.35, { type: 'triangle', vol: 0.22 }));
      tone(1568, t + 0.36, 0.55, { vol: 0.08 });
    },

  return new p5(p => {
    const W = 1200, H = 700, TAU = Math.PI * 2;
    let T = 0, state = 'idle', st = 0, ev = {}, showScope = false, scopeT = 0;

            if (this.acc > 0.05) {           // خلايا جديدة تتكوّن عند طرف الذراع النامية

            }

    function newBubble(anyY) { return { x: rand(0, W), y: anyY ? rand(0, H) : H - rand(90, 130), r: rand(4, 13), s: rand(25, 70), ph: rand(0, TAU) }; }

      p.noStroke(); p.fill(232, 210, 155);                // الرمل
      p.beginShape(); p.vertex(0, H); for (let x = 0; x <= W; x += 30) p.vertex(x, sandY(x)); p.vertex(W, H); p.endShape(p.CLOSE);
      pebbles.forEach(b => { p.fill(b.c, b.c - 20, b.c - 50); p.ellipse(b.x, b.y, b.w, b.w * 0.6); });
      // مرجان
      p.stroke(255, 120, 150); p.strokeWeight(10); p.noFill();
      const cx0 = 1060, cy0 = sandY(1060) + 8;
      p.line(cx0, cy0, cx0, cy0 - 70); p.line(cx0, cy0 - 40, cx0 - 30, cy0 - 85); p.line(cx0, cy0 - 50, cx0 + 28, cy0 - 95); p.line(cx0 - 30, cy0 - 85, cx0 - 40, cy0 - 110);
      p.noStroke(); p.fill(255, 170, 90); p.circle(140, sandY(140) + 6, 46); p.fill(255, 200, 130); p.circle(140, sandY(140) + 6, 26);
      // أسماك
      fish.forEach(f => {
        f.x += f.dir * f.sp * dt; if (f.x > W + 60) f.x = -60; if (f.x < -60) f.x = W + 60;
        p.push(); p.translate(f.x, f.y + Math.sin(T * 2 + f.ph) * 6); p.scale(f.dir, 1);
        p.noStroke(); p.fill(...f.c); p.ellipse(0, 0, f.size * 2.2, f.size * 1.2);
        const wag = Math.sin(T * 8 + f.ph) * f.size * 0.25;
        p.triangle(-f.size * 0.95, 0, -f.size * 1.8, -f.size * 0.6 + wag, -f.size * 1.8, f.size * 0.6 + wag);
        p.fill(255); p.circle(f.size * 0.55, -f.size * 0.12, f.size * 0.42); p.fill(20); p.circle(f.size * 0.62, -f.size * 0.12, f.size * 0.2);
        p.pop();
      });
    }
    function drawFront(dt) {
      weeds.slice(3).forEach(w => weed(w, true));
      bubbles.forEach(b => {
        b.y -= b.s * dt; b.x += Math.sin(T * 2 + b.ph) * 0.3;
        if (b.y < -20) Object.assign(b, newBubble(false));
        p.stroke(255, 255, 255, 150); p.strokeWeight(1.5); p.fill(255, 255, 255, 30); p.circle(b.x, b.y, b.r * 2);
        p.noStroke(); p.fill(255, 255, 255, 170); p.circle(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.5);
      });
      rings.forEach(r => { r.a += dt; p.noFill(); p.stroke(255, 255, 255, 255 * (1 - r.a)); p.strokeWeight(4); p.circle(r.x, r.y, 30 + r.a * 160); });
      rings = rings.filter(r => r.a < 1);
    }

    /* ---------- عدسة المجهر: خلية تنقسم إلى خليتين ---------- */
    function cellPair(cx, cy, off, r) {
      p.fill(225, 120, 90); p.noStroke(); p.circle(cx - off, cy, r * 2 + 6); p.circle(cx + off, cy, r * 2 + 6);
      p.fill(255, 222, 185); p.circle(cx - off, cy, r * 2); p.circle(cx + off, cy, r * 2);
    }
    function chromos(x, y, s = 1) {
      const cols = [[124, 58, 237], [37, 99, 235], [22, 163, 74], [219, 39, 119]];
      cols.forEach((c, i) => { p.push(); p.translate(x + (i % 2 ? 7 : -7) * s, y + (i < 2 ? -8 : 8) * s); p.rotate(i * 0.7); p.fill(...c); p.rect(-3, -8, 6, 16, 3); p.pop(); });
    }
    function drawScope(dt) {
      scopeT += dt;
      const cx = 140, cy = 140, R = 110, ph = (scopeT % 3.4) / 3.4, ease = u => u * u * (3 - 2 * u);
      p.noStroke(); p.fill(0, 0, 0, 70); p.circle(cx + 5, cy + 7, R * 2 + 22);
      p.fill(80, 90, 112); p.circle(cx, cy, R * 2 + 20); p.fill(236, 245, 255); p.circle(cx, cy, R * 2);
      const g = p.drawingContext; g.save(); g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();
      if (ph < 0.3) { cellPair(cx, cy, 0, 60); p.fill(200, 170, 255); p.circle(cx, cy, 52); chromos(cx, cy); }
      else if (ph < 0.55) { const u = ease((ph - 0.3) / 0.25); cellPair(cx, cy, 0, 60); chromos(cx - u * 28, cy, 0.8); chromos(cx + u * 28, cy, 0.8); }
      else if (ph < 0.85) { const u = ease((ph - 0.55) / 0.3); cellPair(cx, cy, u * 34, 60 - u * 20); chromos(cx - 28 - u * 6, cy, 0.8); chromos(cx + 28 + u * 6, cy, 0.8); }
      else { cellPair(cx, cy, 36, 40); p.fill(200, 170, 255); p.circle(cx - 36, cy, 34); p.circle(cx + 36, cy, 34); chromos(cx - 36, cy, 0.6); chromos(cx + 36, cy, 0.6); }
      g.restore();
      p.noFill(); p.stroke(255, 255, 255, 120); p.strokeWeight(3); p.arc(cx, cy, R * 2 - 16, R * 2 - 16, 3.6, 4.6);
    }

    /* ---------- التحكم بالمشهد ---------- */
    function reset() {
      state = 'idle'; st = 0; ev = {}; showScope = false; scopeT = 0; rings = [];
      if (mode === 'hook') { stars = [new Star(W * 0.4, H * 0.54, 150, -0.12, [1, 1, 1, 1, 1])]; ui.caption('اضغطي ▶ لتشاهدي ماذا يحدث في أعماق البحر…'); }
      else { stars = [new Star(W / 2, H * 0.5, 160, 0, [1, 1, 1, 1, 1])]; ui.count(1); ui.caption('🦪 نجم بحر في مزرعة المحار…'); }
    }
    function hookUpdate() {
      if (state !== 'play') return;
      const m = stars[0];
      if (st > 0.6 && !ev.cut) {          // فقدان ذراع
        ev.cut = 1;
        const a = m.armAngle(0) + m.rot, d = m.size * 0.5;
        m.L[0] = 0; m.tL[0] = 0;
        const pc = new Star(m.x + Math.cos(a) * d, m.y + Math.sin(a) * d, m.size * 0.9, m.rot, [1, 0, 0, 0, 0], 0.15);
        pc.tx = W * 0.79; pc.ty = H * 0.62; pc.vr = 1.6; stars.push(pc);
        rings.push({ x: m.x + Math.cos(a) * d, y: m.y + Math.sin(a) * d, a: 0 });
        ui.caption('😮 فقد نجم البحر إحدى أذرعه!'); ev.t = st;
      }
      if (ev.cut && !ev.regrow && st - ev.t > 2.4) {
        ev.regrow = 1; ev.t = st; m.tL[0] = 1; m.rate = 0.14; showScope = true;
        ui.caption('🔬 خلايا جديدة تنقسم <b>انقسامًا متساويًا</b>… لتبني ذراعًا جديدة!');
      }
      if (ev.regrow && !ev.piece && st - ev.t > 4.5) {
        ev.piece = 1; ev.t = st; const pc = stars[1]; pc.tL = [1, 1, 1, 1, 1]; pc.tDisk = 1; pc.rate = 0.13; pc.tSize = 125;
        ui.caption('✨ والقطعة المقطوعة (مع جزء من القرص المركزي) تتجدد لتصبح نجمًا كاملًا!');
      }
      if (ev.piece && !ev.done && st - ev.t > 4.5 && stars.every(s => !s.growing)) {
        ev.done = 1; state = 'done'; showScope = false;
        ui.caption('⭐ ← ⭐⭐ من نجم واحد إلى نجمين… هذا هو <b>التجدد</b>'); ui.done();
      }
    }
    function layout(n) {
      if (n === 3) return [{ x: W * 0.22, y: H * 0.5 }, { x: W * 0.5, y: H * 0.36 }, { x: W * 0.78, y: H * 0.55 }];
      const out = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) out.push({ x: W * (0.2 + c * 0.3), y: H * (0.2 + r * 0.29) });
      return out;
    }
    function farmCut() {
      if (state !== 'idle' || stars.length >= 9) return false;
      state = 'cut'; st = 0; ev = {};
      const old = stars, n = old.length * 3, spots = layout(n); let i = 0; stars = [];
      old.forEach(s => [[0, 1], [2, 3], [4]].forEach(set => {
        const L = [0, 0, 0, 0, 0]; set.forEach(k => L[k] = 1);
        const a = set.reduce((t, k) => t + s.armAngle(k), 0) / set.length + s.rot;
        const pc = new Star(s.x + Math.cos(a) * s.size * 0.3, s.y + Math.sin(a) * s.size * 0.3, s.size, s.rot, L, 0.3);
        pc.tSize = n === 3 ? 115 : 72; pc.tx = spots[i].x; pc.ty = spots[i].y; pc.vr = rand(-1.4, 1.4); i++;
        stars.push(pc); rings.push({ x: s.x, y: s.y, a: 0 });
      }));
      ui.caption('✂️ قُطِّع النجم وأُعيدت القطع إلى البحر…'); return true;
    }
    function farmUpdate() {
      if (state !== 'cut') return;
      if (st > 1.8 && !ev.regrow) { ev.regrow = 1; stars.forEach(s => { s.tL = [1, 1, 1, 1, 1]; s.tDisk = 1; s.rate = 0.17; }); ui.caption('🌱 كل قطعة فيها جزء من القرص المركزي… تتجدد!'); }
      if (ev.regrow && st > 3 && stars.every(s => !s.growing)) {
        state = 'idle'; const n = stars.length;
        ui.count(n); ui.caption(`😲 أصبح العدد <b>${ar(n)}</b> بدل <b>${ar(n / 3)}</b>! المشكلة ازدادت`); ui.done(n);
      }
    }

    p.setup = () => {
      p.createCanvas(W, H); p.pixelDensity(Math.min(2, window.devicePixelRatio || 1));
      build(); reset(); if (!p.active) p.noLoop();
    };
    p.draw = () => {
      const dt = Math.min((p.deltaTime || 16) / 1000, 0.05); T += dt; st += dt;
      drawSea(dt);
      if (mode === 'hook') hookUpdate(); else farmUpdate();
      stars.forEach(s => s.update(dt));
      stars.forEach(s => s.draw());
      drawFront(dt);
      if (showScope) drawScope(dt);
    };
    p.api = {
      play() { reset(); state = 'play'; st = 0; },
      reset, cut: farmCut,
    };
  }, holder);
}


/* =====================================================================
   🧫 المختبر الرقمي: انشطار البكتيريا + تبرعم الهيدرا (مكتبة p5.js)
   ===================================================================== */
function labSketch(holder, ui) {
  return new p5(p => {
    const W = 1100, H = 680, TAU = Math.PI * 2, CX = W / 2, CY = H / 2, R = 300, CAP = 256;
    let T = 0, mode = 'bacteria', running = false, speed = 1;
    let bac = [], gen = 0, hyd = [], free = [], specks = [];
    const FLOOR = H - 70, SPOTS = [0.26, 0.5, 0.72, 0.9, 0.1];

    /* ---------- البكتيريا ---------- */
    const newBac = (x, y, a, g) => ({ x, y, a, g, age: rand(0, 0.6), period: rand(2.6, 3.4), split: -1, vx: 0, vy: 0 });
    function capsule(x, len) {
      p.fill(110, 205, 140); p.stroke(40, 125, 75); p.strokeWeight(2.5); p.rect(x - len / 2, -10, len, 20, 10);
      p.noFill(); p.stroke(30, 95, 60); p.strokeWeight(2);
      p.beginShape(); for (let i = 0; i <= 10; i++) p.vertex(x - 9 + i * 1.8, Math.sin(i * 1.3 + T * 3) * 3.5); p.endShape();
    }
    function drawBac(b) {
      p.push(); p.translate(b.x, b.y); p.rotate(b.a);
      if (b.split < 0) capsule(0, 36);
      else if (b.split < 0.45) {        // الاستطالة ونسخ المادة الوراثية
        const u = b.split / 0.45, len = 36 + u * 34;
        p.fill(110, 205, 140); p.stroke(40, 125, 75); p.strokeWeight(2.5); p.rect(-len / 2, -10, len, 20, 10);
        p.noFill(); p.stroke(30, 95, 60); p.strokeWeight(2);
        [-1, 1].forEach(s => { p.beginShape(); for (let i = 0; i <= 8; i++) p.vertex(s * u * 16 - 7 + i * 1.8, Math.sin(i * 1.3 + T * 3) * 3); p.endShape(); });
        p.stroke(40, 125, 75); p.line(0, -10 + u * 6, 0, 10 - u * 6);
      } else { const u = (b.split - 0.45) / 0.55, off = 18 + u * 8; capsule(-off, 36); capsule(off, 36); }
      p.pop();
    }
    function updBac(dt) {
      const next = [];
      bac.forEach(b => {
        b.vx += rand(-1, 1) * 40 * dt; b.vy += rand(-1, 1) * 40 * dt; b.vx *= 0.95; b.vy *= 0.95;
        b.x += b.vx * dt * 3; b.y += b.vy * dt * 3; b.a += rand(-1, 1) * 0.6 * dt;
        const dx = b.x - CX, dy = b.y - CY, d = Math.hypot(dx, dy);
        if (d > R - 28) { b.x = CX + dx / d * (R - 28); b.y = CY + dy / d * (R - 28); b.vx *= -0.5; b.vy *= -0.5; }
        if (running) {
          b.age += dt * speed;
          if (b.split < 0 && b.age > b.period && bac.length + next.length < CAP) b.split = 0;
          if (b.split >= 0) b.split += dt * speed / 0.9;
        }
        if (b.split >= 1) {
          const off = 26, cx = Math.cos(b.a) * off, cy = Math.sin(b.a) * off;
          next.push(newBac(b.x - cx, b.y - cy, b.a + rand(-0.4, 0.4), b.g + 1), newBac(b.x + cx, b.y + cy, b.a + rand(-0.4, 0.4), b.g + 1));
          gen = Math.max(gen, b.g + 1);
        } else next.push(b);
      });
      const before = bac.length; bac = next;
      if (bac.length !== before) ui.stats(bac.length, gen);
      if (bac.length >= CAP && running) { running = false; ui.full(); }
    }
    function drawDish() {
      const g = p.drawingContext, grd = g.createLinearGradient(0, 0, W, H);
      grd.addColorStop(0, '#22324a'); grd.addColorStop(1, '#2d4566'); g.fillStyle = grd; g.fillRect(0, 0, W, H);
      p.noStroke(); p.fill(0, 0, 0, 60); p.circle(CX + 8, CY + 12, R * 2 + 30);
      p.fill(205, 225, 235); p.circle(CX, CY, R * 2 + 26);
      p.fill(238, 250, 241); p.circle(CX, CY, R * 2);
      p.fill(225, 242, 230); specks.forEach(s => p.circle(s.x, s.y, s.r));
      p.noFill(); p.stroke(255, 255, 255, 160); p.strokeWeight(6); p.arc(CX, CY, R * 2 - 30, R * 2 - 30, 3.5, 4.5);
    }

    /* ---------- الهيدرا ---------- */
    function hydraBody(s, ph, tent, budG) {
      const h = 330, pts = [];
      for (let i = 0; i <= 20; i++) { const u = i / 20; pts.push({ x: Math.sin(T * 0.9 + ph + u * 2.2) * u * u * 18, y: -u * h, w: 13 - 5 * u + 4 * Math.sin(u * Math.PI) }); }
      const poly = ex => { p.beginShape(); pts.forEach(q => p.vertex(q.x - q.w - ex, q.y)); for (let i = pts.length - 1; i >= 0; i--) p.vertex(pts[i].x + pts[i].w + ex, pts[i].y); p.endShape(p.CLOSE); };
      p.noStroke(); p.fill(120, 240, 225, 40); poly(9);
      p.fill(205, 250, 244); poly(0);
      p.noFill(); p.stroke(150, 215, 208); p.strokeWeight(3);
      p.beginShape(); pts.slice(2, 18).forEach(q => p.vertex(q.x, q.y)); p.endShape();
      const top = pts[20];
      if (tent > 0) for (let j = 0; j < 6; j++) {         // اللوامس
        let ang = -Math.PI / 2 + (j - 2.5) * 0.45, x = top.x, y = top.y;
        p.noFill(); p.stroke(205, 250, 244); p.strokeWeight(4); p.beginShape(); p.curveVertex(x, y); p.curveVertex(x, y);
        for (let i = 0; i < 11; i++) { ang += (j < 3 ? -0.06 : 0.06) + Math.sin(T * 1.6 + j + i * 0.4 + ph) * 0.09; x += Math.cos(ang) * 15 * tent; y += Math.sin(ang) * 15 * tent; p.curveVertex(x, y); }
        p.curveVertex(x, y); p.endShape();
      }
      p.noStroke(); p.fill(225, 255, 250); p.ellipse(top.x, top.y, 22, 16);
      if (budG != null) {                                   // البرعم على جانب الجسم
        const b = pts[9]; p.push(); p.translate(b.x + b.w - 3, b.y); p.rotate(1.05); p.scale(Math.min(budG, 1) * 0.36);
        hydraBody(1, ph + 1, Math.max(0, (budG - 0.45) * 1.8), null); p.pop();
      }
    }
    function updHydra(dt) {
      if (!running) return;
      const sp = dt * speed;
      hyd.forEach(h => {
        h.s += (1 - h.s) * Math.min(1, sp * 0.35);
        if (h.s > 0.93 && !h.bud && hyd.length + free.length < 5) { h.cool -= sp; if (h.cool <= 0) { h.bud = { g: 0 }; if (h === hyd[0]) ui.caption('🌱 ينمو برعم صغير على جانب جسم الهيدرا…'); } }
        if (h.bud) {
          h.bud.g += sp / 6;
          if (h.bud.g > 1.25) {
            const a = 1.05, k = h.s, bx = h.x + (13 + Math.sin(T * 0.9 + h.ph + 0.99) * 4) * k, by = FLOOR - 0.45 * 330 * k;
            const tx = W * SPOTS[hyd.length + free.length];
            free.push({ x: bx, y: by, rot: a, tx, s: 0.36 * k, ph: rand(0, 6) });
            h.bud = null; h.cool = 2.5; ui.caption('✨ انفصل البرعم! وأصبح هيدرا جديدة تطابق الأصل');
          }
        }
      });
      free = free.filter(f => {
        f.x += (f.tx - f.x) * Math.min(1, sp * 0.8); f.y += (FLOOR - f.y) * Math.min(1, sp * 0.8); f.rot += (0 - f.rot) * Math.min(1, sp * 0.9);
        if (Math.abs(f.tx - f.x) < 4 && Math.abs(FLOOR - f.y) < 4 && Math.abs(f.rot) < 0.05) {
          hyd.push({ x: f.tx, s: f.s, ph: f.ph, bud: null, cool: 3 }); ui.stats(hyd.length, null); return false;
        }
        return true;
      });
    }
    function drawHydraScene() {
      const g = p.drawingContext, grd = g.createLinearGradient(0, 0, 0, H);
      grd.addColorStop(0, '#071b33'); grd.addColorStop(1, '#0c3b52'); g.fillStyle = grd; g.fillRect(0, 0, W, H);
      p.noStroke(); specks.forEach(s => { p.fill(180, 240, 255, 60); p.circle(s.x, (s.y + T * 8) % H, s.r * 0.6); });
      p.fill(40, 70, 70); p.rect(0, FLOOR - 4, W, H - FLOOR + 4);
      p.fill(60, 95, 90); for (let x = 0; x < W; x += 70) p.ellipse(x + 20, FLOOR + 6, 80, 22);
      hyd.forEach(h => { p.push(); p.translate(h.x, FLOOR); p.scale(h.s); hydraBody(h.s, h.ph, 1, h.bud ? h.bud.g : null); p.pop(); });
      free.forEach(f => { p.push(); p.translate(f.x, f.y); p.rotate(f.rot); p.scale(f.s); hydraBody(f.s, f.ph, 1, null); p.pop(); });
    }

    function reset() {
      T = 0; running = false; gen = 0;
      if (mode === 'bacteria') { bac = [newBac(CX, CY, 0.3, 0)]; ui.stats(1, 0); ui.caption('🦠 خلية بكتيريا واحدة في طبق بتري… اضغطي ▶'); }
      else { hyd = [{ x: W * SPOTS[0], s: 1, ph: 0, bud: null, cool: 1.2 }]; free = []; ui.stats(1, null); ui.caption('🌿 هيدرا تعيش في المياه العذبة… اضغطي ▶'); }
      ui.running(false);
    }
    p.setup = () => {
      p.createCanvas(W, H); p.pixelDensity(Math.min(2, window.devicePixelRatio || 1));
      specks = Array.from({ length: 60 }, () => { const a = rand(0, TAU), r = Math.sqrt(Math.random()) * (R - 10); return { x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r, r: rand(3, 9) }; });
      reset(); if (!p.active) p.noLoop();
    };
    p.draw = () => {
      const dt = Math.min((p.deltaTime || 16) / 1000, 0.05); T += dt;
      if (mode === 'bacteria') { drawDish(); updBac(dt); bac.forEach(drawBac); }
      else { updHydra(dt); drawHydraScene(); }
    };
    p.api = {
      setMode(m) { mode = m; reset(); },
      toggle() { running = !running; ui.running(running); if (running && mode === 'bacteria' && bac.length === 1) ui.caption('🧬 تُنسخ المادة الوراثية… ثم تنشطر الخلية إلى خليتين!'); return running; },
      reset,
      fast() { speed = speed === 1 ? 2.5 : 1; return speed; },
      get count() { return mode === 'bacteria' ? bac.length : hyd.length; },
      get minutes() { return gen * 20; },
      get mode() { return mode; },
    };
  }, holder);
}


/* =====================================================================
   🖼️ أنواع الشرائح: render = شكل الشريحة | mount = تشغيل تفاعلاتها

  sort: {
    render: s => `${head(s)}

        <div class="bins">${s.bins.map((b, i) => `<div class="bin rv" style="--d:${2 + i};--c:${b.c}" data-cat="${b.id}"><span class="bin-i">${b.i}</span><span class="bin-h">${b.t}</span><span class="bin-s">${b.s}</span><div class="bin-list"></div></div>`).join('')}</div>
        <div class="sort-foot rv" style="--d:6"><span class="tip">👆 اختاري مخلوقًا ثم اضغطي على المجموعة المناسبة (أو اسحبيه إليها)</span><div class="feedback"></div><button class="btn small reset">↺ من جديد</button></div>
      </div>`,
    mount(el, s) {
      const itemsBox = $('.items', el), fb = $('.feedback', el);
      let sel = null;
      const say = (ok, t) => { fb.className = 'feedback show ' + (ok ? 'ok' : 'bad'); fb.textContent = t; };
      const tryDrop = (item, bin) => {
        if (!item || !bin) return;
        if (item.dataset.c === bin.dataset.cat) {
          $('.bin-list', bin).insertAdjacentHTML('beforeend', `<span>${item.innerHTML}</span>`);
          item.remove(); sel = null; bin.classList.add('good'); setTimeout(() => bin.classList.remove('good'), 600);
          Sound.success(); say(true, 'أحسنتِ! 👏 إجابة صحيحة');
          if (!$('.item', itemsBox)) { say(true, '🎉 رائع! صنّفتِ جميع المخلوقات'); Confetti.rain(); }
        } else {
          [item, bin].forEach(x => { x.classList.remove('wrong'); void x.offsetWidth; x.classList.add('wrong'); });
          Sound.wrong(); say(false, 'حاولي مرة أخرى 💜');
        }
      };
      const build = () => {
        itemsBox.innerHTML = shuffle(s.items).map(it => `<button class="item" data-c="${it.c}">${icon(it.i)} ${it.t}</button>`).join('');
        $$('.bin-list', el).forEach(b => b.innerHTML = ''); fb.className = 'feedback'; sel = null;
        $$('.item', el).forEach(it => enableDrag(it));
      };
      // اختيار بالنقر + سحب وإفلات (يعمل باللمس على السبورة الذكية)
      function enableDrag(it) {
        it.addEventListener('pointerdown', e => {
          const sx = e.clientX, sy = e.clientY; let ghost = null;
          const move = ev => {
            if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 12) {
              ghost = it.cloneNode(true); ghost.classList.add('ghost'); ghost.style.setProperty('--gs', stageScale);
              $('#fxLayer').appendChild(ghost); it.style.opacity = .35;
            }
            if (ghost) {
              ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
              const over = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.bin');
              $$('.bin', el).forEach(b => b.classList.toggle('hover', b === over));
            }
          };
          const up = ev => {
            removeEventListener('pointermove', move); removeEventListener('pointerup', up);
            $$('.bin', el).forEach(b => b.classList.remove('hover'));
            if (ghost) {
              ghost.remove(); it.style.opacity = '';
              tryDrop(it, document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.bin'));
              it._dragged = true; setTimeout(() => { it._dragged = false; }, 0);
            }
          };
          addEventListener('pointermove', move); addEventListener('pointerup', up);
        });
        it.addEventListener('click', () => {
          if (it._dragged) { it._dragged = false; return; }
          $$('.item', el).forEach(x => x.classList.toggle('sel', x === it && !it.classList.contains('sel')));
          sel = it.classList.contains('sel') ? it : null; Sound.tick();
        });
      }
      $$('.bin', el).forEach(b => b.addEventListener('click', () => { if (sel) tryDrop(sel, b); }));
      $('.reset', el).onclick = build;
      build();
    },
  },

/* بطاقات القلب */
function bindFlips(root) { $$('.flip', root).forEach(f => f.addEventListener('click', () => { f.classList.toggle('on'); Sound.pop(); })); }


/* =====================================================================
   🧭 محرّك العرض: بناء الشرائح + التنقل + التحريك
   ===================================================================== */
const stageEl = $('#stage'), slidesEl = $('#slides');
const slides = LESSON.slides;
let cur = -1, stageScale = 1;

// ملء الشاشة بالكامل: عرض التصميم 1920 بكسل (أو ارتفاع 1080) ثم تكبير/تصغير متناسق
function fitStage() {
  const vw = innerWidth, vh = innerHeight, aspect = vw / vh;
  let W = 1920, H = 1080;
  if (aspect >= 16 / 9) W = Math.round(1080 * aspect); else H = Math.round(1920 / aspect);
  stageScale = vw / W;
  stageEl.style.width = W + 'px'; stageEl.style.height = H + 'px';
  stageEl.style.transform = `translate(-50%,-50%) scale(${stageScale})`;
}
fitStage(); addEventListener('resize', fitStage);

// بناء جميع الشرائح
slides.forEach((s, i) => {
  const T = TYPES[s.type];
  if (!T) { console.warn('نوع شريحة غير معروف:', s.type); return; }
  const el = document.createElement('section');
  el.className = `slide t-${s.type}${T.dark || s.dark ? ' dark' : ''}`;
  el.innerHTML = T.render(s, i);
  slidesEl.appendChild(el);
  s._el = el;
});
// تشغيل التفاعلات بعد إضافة كل الشرائح
slides.forEach(s => { const T = TYPES[s.type]; s._ctl = (T && T.mount && T.mount(s._el, s)) || null; });
$('#drawModal .draw-slot').innerHTML = Draw.html(); Draw.bind($('#drawModal'));

const FX = {
  fade:  { in: 'none', out: 'none' },
  slide: { in: d => `translateX(${d * 140}px)`, out: d => `translateX(${-d * 140}px)` },
  zoom:  { in: () => 'scale(.9)', out: () => 'scale(1.06)' },
};
function goTo(n) {
  n = Math.max(0, Math.min(slides.length - 1, n));
  if (n === cur || !slides[n]._el) return;
  const dir = n > cur ? 1 : -1, prev = cur >= 0 ? slides[cur] : null, next = slides[n];
  const fx = FX[next.fx] || FX.fade;
  if (prev) {
    prev._el.classList.remove('active');
    prev._el.style.transform = typeof fx.out === 'function' ? fx.out(dir) : '';
    prev._ctl?.leave?.();
  }
  const el = next._el;
  el.style.transition = 'none';
  el.style.transform = typeof fx.in === 'function' ? fx.in(dir) : '';
  void el.offsetWidth;
  el.style.transition = '';
  el.classList.add('active');
  el.style.transform = '';
  cur = n;
  next._ctl?.enter?.();
  $('#counter').textContent = `${ar(n + 1)} / ${ar(slides.length)}`;
  $('#progress i').style.width = ((n + 1) / slides.length * 100) + '%';
  $('#prevBtn').disabled = n === 0; $('#nextBtn').disabled = n === slides.length - 1;
  try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) {}
}
const nextSlide = () => goTo(cur + 1);
const prevSlide = () => goTo(cur - 1);

/* ---------- النوافذ المنبثقة ---------- */
function openModal(id) {
  if (id === 'namesModal') $('#namesArea').value = Draw.names().join('\n');
  $('#' + id).classList.add('open');
}
function closeModals() { $$('.modal.open').forEach(m => m.classList.remove('open')); }
$$('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('open'); }));
$('#namesSave').onclick = () => {
  const list = $('#namesArea').value.split('\n').map(x => x.trim()).filter(Boolean);
  store.set('steam-students', list.length ? list : null); Draw.picked = []; Draw.refresh();
  $('#namesModal').classList.remove('open'); Sound.success();
};
$('#namesDefault').onclick = () => { $('#namesArea').value = LESSON.students.join('\n'); };

/* ---------- أزرار شريط التحكم ---------- */
$('#prevBtn').onclick = prevSlide;
$('#nextBtn').onclick = nextSlide;
$('#clapBtn').onclick = clap;
$('#drawBtn').onclick = () => openModal('drawModal');
function toggleFS() {
  if (!document.fullscreenElement) { const r = document.documentElement.requestFullscreen?.(); r && r.catch(() => {}); }
  else document.exitFullscreen?.();
}
$('#fsBtn').onclick = toggleFS;

/* ---------- أزرار عامة داخل الشرائح ---------- */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) {
    const v = go.dataset.go;
    if (v === 'next') nextSlide();
    else if (/^\d+$/.test(v)) goTo(+v);
    else { const i = slides.findIndex(s => s.id === v); if (i >= 0) goTo(i); }
  }
  if (e.target.closest('[data-draw]')) openModal('drawModal');
  if (e.target.closest('[data-clap]')) clap();
  const b = e.target.closest('button'); if (b) setTimeout(() => b.blur(), 0);   // حتى لا يُعاد تفعيل الزر بالمسافة
});

/* ---------- لوحة المفاتيح ---------- */
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input[type=text], textarea');
  if (e.key === 'Escape') { closeModals(); e.target.blur?.(); return; }
  if (typing) return;
  const drawOpen = $('#drawModal').classList.contains('open');
  const anyModal = $('.modal.open');

  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (drawOpen) Draw.spin($('#drawModal .draw'));
    else if (!anyModal) nextSlide();
    return;
  }
  if (anyModal) return;
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': e.preventDefault(); nextSlide(); return;
    case 'ArrowLeft':  case 'PageUp':   e.preventDefault(); prevSlide(); return;
    case 'ArrowUp': case 'ArrowDown': e.preventDefault(); return;
    case 'Home': e.preventDefault(); goTo(0); return;
    case 'End':  e.preventDefault(); goTo(slides.length - 1); return;
  }
  if (e.key === 'ت' || e.key === 't' || e.key === 'T') { e.preventDefault(); clap(); return; }
  if (e.key === 'ق' || e.key === 'q' || e.key === 'Q') { e.preventDefault(); openModal('drawModal'); return; }
  if (e.code === 'KeyF') { e.preventDefault(); toggleFS(); }
});
// منع التمرير بعجلة الفأرة أو اللمس + إرجاع أي إزاحة تحدث بسبب التركيز على عنصر
addEventListener('wheel', e => e.preventDefault(), { passive: false });
document.addEventListener('scroll', e => {
  const t = e.target;
  if (t === document || t === document.documentElement) { scrollTo(0, 0); return; }
  if (t.nodeType === 1 && t.tagName !== 'TEXTAREA') { t.scrollTop = 0; t.scrollLeft = 0; }
}, true);

/* ---------- إخفاء شريط التحكم عند عدم تحريك الفأرة ---------- */
let idleTimer;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!$('#controls').matches(':hover') && !$('.modal.open')) document.body.classList.add('idle'); }, 2800);
}
['mousemove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
wake();

/* ---------- البدء (يتذكر رقم الشريحة عند تحديث الصفحة) ---------- */
const startAt = parseInt(location.hash.slice(1), 10);
goTo(Number.isFinite(startAt) ? startAt - 1 : 0);
</script>
</body>
